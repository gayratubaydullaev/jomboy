# Weekly database backup via SSH (optional — enable with BACKUP_ENABLED=true).
name: Backup Database

on:
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch:

jobs:
  backup:
    name: pg_dump on server
    runs-on: ubuntu-latest
    if: vars.BACKUP_ENABLED == 'true'
    steps:
      - uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            set -e
            cd ${{ vars.DEPLOY_PATH || '/opt/myshopuz' }}
            set -a
            [ -f .env ] && . ./.env
            set +a
            mkdir -p backups
            STAMP=$(date +%Y%m%d-%H%M%S)
            docker compose -f docker-compose.deploy.yml exec -T db \
              pg_dump -U "${POSTGRES_USER:-postgres}" "${POSTGRES_DB:-myshopuz}" \
              | gzip > "backups/myshopuz-${STAMP}.sql.gz"
            ls -lh backups/myshopuz-${STAMP}.sql.gz
            find backups -name 'myshopuz-*.sql.gz' -mtime +14 -delete
