# Staging CD: build images on develop; deploy when DEPLOY_STAGING_ENABLED=true
name: CD Staging

on:
  push:
    branches: [develop]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  API_IMAGE: ${{ github.event.repository.name }}-api
  WEB_IMAGE: ${{ github.event.repository.name }}-web

jobs:
  docker:
    name: Build & push staging images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_PUSH_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Build and push API (staging)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.API_IMAGE }}:staging
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.API_IMAGE }}:staging-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Web (staging)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.WEB_IMAGE }}:staging
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.WEB_IMAGE }}:staging-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.STAGING_NEXT_PUBLIC_API_URL || vars.NEXT_PUBLIC_API_URL || 'https://api-staging.myshop.uz' }}
            NEXT_PUBLIC_SITE_URL=${{ vars.STAGING_NEXT_PUBLIC_SITE_URL || 'https://staging.myshop.uz' }}
            JWT_SECRET=${{ secrets.STAGING_JWT_SECRET || secrets.JWT_SECRET || 'staging-jwt-secret-min-32-chars-long!!' }}
            SESSION_COOKIE_SECRET=${{ secrets.STAGING_SESSION_COOKIE_SECRET || secrets.SESSION_COOKIE_SECRET || 'staging-session-secret-min-32-chars!!' }}
            BUILD_ID=staging-${{ github.sha }}
            GITHUB_SHA=${{ github.sha }}
            NEXT_PUBLIC_SENTRY_DSN=${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
            NEXT_PUBLIC_SENTRY_RELEASE=staging-${{ github.sha }}

  deploy-staging:
    name: Deploy to staging server
    runs-on: ubuntu-latest
    needs: docker
    if: success() && vars.DEPLOY_STAGING_ENABLED == 'true'
    environment: staging
    env:
      DEPLOY_IMAGE: ghcr.io/${{ github.repository_owner }}/${{ env.API_IMAGE }}:staging
      DEPLOY_WEB_IMAGE: ghcr.io/${{ github.repository_owner }}/${{ env.WEB_IMAGE }}:staging
      DEPLOY_PATH: ${{ vars.STAGING_DEPLOY_PATH || vars.DEPLOY_PATH || '/opt/myshopuz-staging' }}
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.STAGING_SERVER_HOST || secrets.SERVER_HOST }}
          username: ${{ secrets.STAGING_SERVER_USERNAME || secrets.SERVER_USERNAME }}
          key: ${{ secrets.STAGING_SSH_PRIVATE_KEY || secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.STAGING_DEPLOY_PORT || secrets.DEPLOY_PORT || 22 }}
          script: |
            set -e
            cd ${{ env.DEPLOY_PATH }}
            git fetch origin develop && git reset --hard origin/develop
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ${{ env.REGISTRY }} -u ${{ github.repository_owner }} --password-stdin
            export DEPLOY_IMAGE="${{ env.DEPLOY_IMAGE }}"
            export DEPLOY_WEB_IMAGE="${{ env.DEPLOY_WEB_IMAGE }}"
            export SENTRY_RELEASE="staging-${{ github.sha }}"
            docker compose -f docker-compose.deploy.yml pull
            docker compose -f docker-compose.deploy.yml up -d --wait
            docker compose -f docker-compose.deploy.yml ps
