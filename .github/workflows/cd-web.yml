# Web CD: build Next.js on main (deploy step mirrors API when DEPLOY_WEB_ENABLED=true)
name: CD Web

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: '20'

jobs:
  build-web:
    name: Build web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.14.2
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @myshopuz/web run build
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL || 'http://localhost:4000' }}
          JWT_SECRET: ${{ secrets.JWT_SECRET || 'ci-web-jwt-secret-min-32-chars-long!!' }}
          SESSION_COOKIE_SECRET: ${{ secrets.SESSION_COOKIE_SECRET || 'ci-web-session-secret-min-32-chars' }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL || 'http://localhost:3000' }}

  deploy-web:
    name: Deploy web to server
    runs-on: ubuntu-latest
    needs: build-web
    if: success() && vars.DEPLOY_WEB_ENABLED == 'true'
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            set -e
            cd ${{ vars.DEPLOY_PATH || '/opt/myshopuz' }}
            git fetch origin main && git reset --hard origin/main
            set -a
            [ -f .env ] && . ./.env
            [ -f apps/web/.env ] && . ./apps/web/.env
            set +a
            pnpm install --frozen-lockfile
            pnpm --filter @myshopuz/web run build
            pm2 restart myshopuz-web || pm2 start pnpm --name myshopuz-web -- start
