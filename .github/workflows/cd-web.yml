# Web CD: build & push Docker image to GHCR; deploy via docker compose when enabled.
name: CD Web

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Optional image tag override (default: short SHA + latest)'
        required: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.event.repository.name }}-web

jobs:
  docker-web:
    name: Build & push Web image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tags: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_PUSH_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Image meta
        id: meta
        run: |
          TAG="${{ github.event.inputs.image_tag }}"
          if [ -z "$TAG" ]; then TAG="${GITHUB_SHA::7}"; fi
          echo "version=$TAG" >> $GITHUB_OUTPUT
          echo "tags=${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${TAG},${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:latest" >> $GITHUB_OUTPUT

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL || 'https://api.myshop.uz' }}
            NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL || 'https://myshop.uz' }}
            JWT_SECRET=${{ secrets.JWT_SECRET || 'ci-web-jwt-secret-min-32-chars-long!!' }}
            SESSION_COOKIE_SECRET=${{ secrets.SESSION_COOKIE_SECRET || 'ci-web-session-secret-min-32-chars!!' }}
            BUILD_ID=${{ github.sha }}
            GITHUB_SHA=${{ github.sha }}
            NEXT_SERVER_ACTIONS_ENCRYPTION_KEY=${{ secrets.NEXT_SERVER_ACTIONS_ENCRYPTION_KEY }}
            NEXT_PUBLIC_SENTRY_DSN=${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
            NEXT_PUBLIC_SENTRY_RELEASE=${{ github.sha }}

  deploy-web:
    name: Deploy web to server
    runs-on: ubuntu-latest
    needs: docker-web
    if: success() && vars.DEPLOY_WEB_ENABLED == 'true'
    environment: production
    env:
      DEPLOY_WEB_IMAGE: ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}-web:latest
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/myshopuz' }}
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            set -e
            cd ${{ env.DEPLOY_PATH }}
            git fetch origin main && git reset --hard origin/main
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ${{ env.REGISTRY }} -u ${{ github.repository_owner }} --password-stdin
            export DEPLOY_WEB_IMAGE="${{ env.DEPLOY_WEB_IMAGE }}"
            docker compose -f docker-compose.deploy.yml pull web
            docker compose -f docker-compose.deploy.yml up -d --wait web
            docker compose -f docker-compose.deploy.yml ps web
            docker image prune -f

  deploy-web-legacy-pm2:
    name: Deploy web (PM2 fallback)
    runs-on: ubuntu-latest
    needs: docker-web
    if: success() && vars.DEPLOY_WEB_PM2 == 'true'
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            set -e
            cd ${{ vars.DEPLOY_PATH || '/opt/myshopuz' }}
            git fetch origin main && git reset --hard origin/main
            set -a
            [ -f .env ] && . ./.env
            [ -f apps/web/.env ] && . ./apps/web/.env
            set +a
            pnpm install --frozen-lockfile
            pnpm turbo run build --filter=@myshopuz/web
            pm2 restart myshopuz-web || pm2 start pnpm --name myshopuz-web --cwd apps/web -- start
