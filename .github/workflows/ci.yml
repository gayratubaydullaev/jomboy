# Mercury (MyShopUZ) — CI: lint, build, test
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: '20'

jobs:
  ci:
    name: Lint, Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.14.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Lint
        run: pnpm run lint

      - name: Build
        run: pnpm run build
        env:
          # API (NestJS)
          DATABASE_URL: postgresql://test:test@localhost:5432/test
          JWT_SECRET: ci-test-secret-min-32-chars
          REDIS_URL: redis://localhost:6379
          NODE_ENV: production
          # Web (Next.js)
          NEXT_PUBLIC_API_URL: http://localhost:4000
          JWT_SECRET: ci-test-jwt-secret-min-32-chars-long!!
          SESSION_COOKIE_SECRET: ci-test-session-secret-min-32-chars!!

      - name: Test
        run: pnpm run test

  api-e2e:
    name: API E2E
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.14.2
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - name: Migrate test database
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test
        run: pnpm exec prisma migrate deploy
      - name: Seed test database
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test
        run: pnpm exec prisma db seed
      - name: API e2e tests
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test
          JWT_SECRET: ci-test-secret-min-32-chars-long-enough
          REDIS_URL: redis://localhost:6379
          NODE_ENV: test
          PAYME_MERCHANT_ID: e2e-merchant
          PAYME_KEY: e2e-payme-secret-key
        run: pnpm run test:e2e
